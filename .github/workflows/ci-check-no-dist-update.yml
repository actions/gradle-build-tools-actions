name: CI-check-no-dist-update

# Verify that the checked-in distribution matches the source.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sources/**'
      - 'dist/**'

permissions:
  contents: read

jobs:
  # Keep this identifier for compatibility with existing branch protection.
  fail-on-dist-update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: sources/package-lock.json

    - name: Install npm dependencies
      working-directory: sources
      run: npm clean-install

    - name: Build distribution
      working-directory: sources
      run: npm run compile

    - name: Verify checked-in distribution
      run: |
        if ! diff --recursive --brief sources/dist dist; then
          echo "The checked-in 'dist' directory does not match the compiled sources."
          echo "Run 'npm clean-install && npm run compile' in 'sources', then copy 'sources/dist/' to 'dist/'."
          exit 1
        fi
